<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy - Free Play</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
  body{
    background:#70c5ce;
    font-family: ui-sans-system, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;overflow:hidden;
  }
  #wrap{
    position:relative;
    width:100%;
    max-width:400px;
    aspect-ratio: 9 / 14.5;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    border-radius:18px;
    overflow:hidden;
    background: linear-gradient(#70c5ce 0%, #b6e0e6 60%, #d6ecee 100%);
  }
  canvas{display:block;width:100%;height:100%;}
  #ui{
    position:absolute;left:0;top:0;right:0;bottom:0;
    pointer-events:none;
  }
  #score{
    position:absolute;top:18px;left:0;right:0;
    text-align:center;
    font-size:54px;font-weight:900;color:white;
    -webkit-text-stroke: 2px #000; text-stroke: 2px #000;
    text-shadow:0 3px 0 #000;
    letter-spacing:2px;
  }
  #centerMsg{
    position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);
    width:84%; text-align:center;
    pointer-events:none;
  }
  #centerMsg h1{
    font-size:28px;font-weight:900;color:white;
    -webkit-text-stroke:1.5px #000;
    text-shadow:0 3px 0 #000;
    margin-bottom:10px;
  }
  #centerMsg p{
    font-size:15px;font-weight:600;color:#1a2a2a;
    background:rgba(255,255,255,.9);
    display:inline-block;padding:8px 14px;border-radius:999px;
    box-shadow:0 4px 0 rgba(0,0,0,.15);
  }
  #controls{
    position:absolute;left:12px;right:12px;bottom:12px;
    display:flex;gap:8px;pointer-events:auto;
  }
  button{
    flex:1;border:none;border-radius:12px;padding:12px 10px;
    font-weight:800;font-size:13px;letter-spacing:.5px;
    cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);
    transition:.1s transform;
  }
  button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
  #btnRestart{background:#ffe14d;color:#222;}
  #btnAgent{background:#222;color:#fff;}
  #btnAgent.on{background:#8b5cf6;color:white;}
  .hide{display:none !important;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="400" height="680"></canvas>
  <div id="ui">
    <div id="score">0</div>
    <div id="centerMsg">
      <h1 id="title">GET READY</h1>
      <p id="subtitle">tap / click / space to flap</p>
    </div>
    <div id="controls">
      <button id="btnRestart">RESTART</button>
      <button id="btnAgent">AGENT: OFF</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const titleEl = document.getElementById('title');
const subEl = document.getElementById('subtitle');
const centerMsg = document.getElementById('centerMsg');
const btnRestart = document.getElementById('btnRestart');
const btnAgent = document.getElementById('btnAgent');

let W = canvas.width, H = canvas.height;
const GROUND_H = 96;

let state = 0; // 0 ready, 1 playing, 2 over
let frames = 0;
let score = 0, best = 0;
let bird, pipes;
let agentOn = false;

class Bird {
  constructor(){
    this.x = 80;
    this.y = 300;
    this.w = 34; this.h = 24;
    this.vy = 0;
    this.rot = 0;
  }
  flap(){
    this.vy = -9.2;
  }
  update(){
    this.vy += 0.52;
    if(this.vy > 12) this.vy = 12;
    this.y += this.vy;
    this.rot = Math.min(Math.PI/2, Math.max(-0.6, this.vy * 0.08));
    // ceiling
    if(this.y < 0){ this.y = 0; this.vy = 0; }
  }
  draw(){
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    ctx.beginPath(); ctx.ellipse(4,8,16,12,0,0,Math.PI*2); ctx.fill();
    // body
    ctx.fillStyle = '#ffeb3b';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0,0,17,12,0,0,Math.PI*2);
    ctx.fill(); ctx.stroke();
    // wing
    ctx.fillStyle = '#ffca28';
    ctx.beginPath();
    ctx.ellipse(-4,4,9,5, -0.3, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    // eye
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(8,-4,6,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'black';
    ctx.beginPath(); ctx.arc(10,-3,2.5,0,Math.PI*2); ctx.fill();
    // beak
    ctx.fillStyle = '#ff6f00';
    ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(26,-3); ctx.lineTo(26,4); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  getBox(){
    return {x:this.x-14, y:this.y-10, w:26, h:20};
  }
}

class Pipe {
  constructor(x){
    this.x = x;
    this.w = 62;
    this.gap = 138;
    this.topH = 80 + Math.random()* (H - GROUND_H - 200 - this.gap);
    this.passed = false;
  }
  update(){
    this.x -= 2.6;
  }
  draw(){
    // top pipe
    const topH = this.topH;
    const bottomY = topH + this.gap;
    ctx.fillStyle = '#73bf2e';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    // top
    ctx.fillRect(this.x, 0, this.w, topH);
    ctx.strokeRect(this.x, 0, this.w, topH);
    ctx.fillRect(this.x-4, topH-18, this.w+8, 18);
    ctx.strokeRect(this.x-4, topH-18, this.w+8, 18);
    // bottom
    ctx.fillRect(this.x, bottomY, this.w, H - bottomY - GROUND_H);
    ctx.strokeRect(this.x, bottomY, this.w, H - bottomY - GROUND_H);
    ctx.fillRect(this.x-4, bottomY, this.w+8, 18);
    ctx.strokeRect(this.x-4, bottomY, this.w+8, 18);
  }
}

function reset(){
  bird = new Bird();
  pipes = [];
  pipes.push(new Pipe(W + 80));
  score = 0;
  frames = 0;
  scoreEl.textContent = '0';
  state = 0;
  titleEl.textContent = 'GET READY';
  subEl.textContent = 'tap / click / space to flap';
  centerMsg.classList.remove('hide');
}

function start(){
  if(state===0){
    state=1;
    centerMsg.classList.add('hide');
  }
}

function gameOver(){
  state=2;
  if(score>best) best=score;
  titleEl.textContent = 'GAME OVER';
  subEl.textContent = `score ${score} | best ${best} - tap to restart`;
  centerMsg.classList.remove('hide');
}

function collide(a,b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update(){
  frames++;
  if(state===1){
    bird.update();
    
    // agent logic
    if(agentOn){
      let next = pipes.find(p=>p.x + p.w > bird.x - 20);
      if(next){
        let targetY = next.topH + next.gap/2;
        // simple proportional: flap if below target and falling
        if(bird.y > targetY + 6 && bird.vy > -2){
          bird.flap();
        }
      }
    }

    if(pipes[pipes.length-1].x < W - 180){
      pipes.push(new Pipe(W+10));
    }
    for(let p of pipes){
      p.update();
      // collision
      let box = bird.getBox();
      let topRect = {x:p.x, y:0, w:p.w, h:p.topH};
      let botRect = {x:p.x, y:p.topH + p.gap, w:p.w, h: H};
      if(collide(box, topRect) || collide(box, botRect)){
        gameOver();
      }
      if(!p.passed && p.x + p.w < bird.x){
        p.passed = true;
        score++;
        scoreEl.textContent = score;
      }
    }
    pipes = pipes.filter(p=>p.x + p.w > -20);
    // ground
    if(bird.y + 12 > H - GROUND_H){
      bird.y = H - GROUND_H -12;
      gameOver();
    }
  }
}

function drawBg(){
  // clouds
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for(let i=0;i<3;i++){
    let cx = (frames*0.3 + i*140) % (W+60) -30;
    let cy = 70 + i*45;
    ctx.beginPath();
    ctx.arc(cx, cy, 18,0, Math.PI*2);
    ctx.arc(cx+18, cy+4, 14,0, Math.PI*2);
    ctx.arc(cx-18, cy+4, 12,0, Math.PI*2);
    ctx.fill();
  }
  // ground
  ctx.fillStyle = '#ded895';
  ctx.fillRect(0, H-GROUND_H, W, GROUND_H);
  ctx.fillStyle = '#8be644';
  ctx.fillRect(0, H-GROUND_H, W, 16);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.strokeRect(0, H-GROUND_H, W, 16);
  // ground pattern
  ctx.fillStyle = 'rgba(0,0,0,.08)';
  for(let x=0;x<W;x+=22){
    ctx.fillRect(x, H-GROUND_H+22, 10, 6);
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawBg();
  for(let p of pipes) p.draw();
  bird.draw();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

function flapAction(){
  if(state===0){ start(); bird.flap(); }
  else if(state===1){ bird.flap(); }
  else if(state===2){ reset(); }
}

canvas.addEventListener('mousedown', flapAction);
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); flapAction(); }, {passive:false});
window.addEventListener('keydown', e=>{
  if(e.code==='Space' || e.code==='ArrowUp'){ e.preventDefault(); flapAction(); }
});
btnRestart.addEventListener('click', ()=>reset());
btnAgent.addEventListener('click', ()=>{
  agentOn = !agentOn;
  btnAgent.textContent = agentOn ? 'AGENT: ON' : 'AGENT: OFF';
  btnAgent.classList.toggle('on', agentOn);
  if(state===0 && agentOn){ start(); }
});

reset();
loop();
</script>
</body>
</html>
